<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison d’architectures : Von Neumann et neuromorphique</title>
  <desc id="desc">Deux panneaux comparant l’architecture Von Neumann, avec CPU ou GPU et DRAM reliés par un bus, et une architecture neuromorphique composée d’un réseau de cœurs calcul et mémoire.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8.2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#161616"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#727272"/>
    </marker>
    <style>
      .sans { font-family: "DejaVu Sans", "Noto Sans", sans-serif; fill: #151515; }
      .panel-title { font-size: 24px; font-weight: 700; letter-spacing: .1px; }
      .component-label { font-size: 25px; font-weight: 400; }
      .small-label { font-size: 16px; font-weight: 400; }
      .core-label { font-size: 24px; font-weight: 600; }
      .center-label { font-size: 15px; font-weight: 400; }
    </style>
  </defs>

  <!-- white ground -->
  <rect x="0" y="0" width="1160" height="520" fill="#ffffff"/>

  <!-- panel separator -->
  <line x1="580" y1="34" x2="580" y2="486" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="7 8"/>

  <!-- LEFT: Von Neumann -->
  <text class="sans panel-title" x="290" y="64" text-anchor="middle">a) Von Neumann</text>

  <rect x="175" y="115" width="230" height="95" rx="12" fill="#fdeaea" stroke="#a01818" stroke-width="2.5"/>
  <text class="sans component-label" x="290" y="163" text-anchor="middle" dominant-baseline="middle">CPU / GPU</text>

  <rect x="175" y="296" width="230" height="95" rx="12" fill="#e6e9fb" stroke="#1a1ab0" stroke-width="2.5"/>
  <text class="sans component-label" x="290" y="343" text-anchor="middle" dominant-baseline="middle">DRAM (Mémoire)</text>

  <!-- double-line bidirectional bus -->
  <line x1="280" y1="220" x2="280" y2="285" stroke="#161616" stroke-width="2.2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>

  <text class="sans small-label" x="392" y="250">Bus</text>
  <text class="sans small-label" x="322" y="270">(Goulot d’étranglement)</text>

  <!-- RIGHT: Neuromorphique -->
  <text class="sans panel-title" x="870" y="64" text-anchor="middle">b) Neuromorphique</text>

  <!-- four neuromorphic cores -->
  <rect x="700" y="115" width="95" height="95" rx="12" fill="#e2f7e2" stroke="#18a018" stroke-width="2.5"/>
  <rect x="945" y="115" width="95" height="95" rx="12" fill="#e2f7e2" stroke="#18a018" stroke-width="2.5"/>
  <rect x="700" y="296" width="95" height="95" rx="12" fill="#e2f7e2" stroke="#18a018" stroke-width="2.5"/>
  <rect x="945" y="296" width="95" height="95" rx="12" fill="#e2f7e2" stroke="#18a018" stroke-width="2.5"/>
  <text class="sans core-label" x="747.5" y="163" text-anchor="middle" dominant-baseline="middle">C+M</text>
  <text class="sans core-label" x="992.5" y="163" text-anchor="middle" dominant-baseline="middle">C+M</text>
  <text class="sans core-label" x="747.5" y="343" text-anchor="middle" dominant-baseline="middle">C+M</text>
  <text class="sans core-label" x="992.5" y="343" text-anchor="middle" dominant-baseline="middle">C+M</text>

  <!-- bidirectional links, kept in the gaps between cores -->
  <line x1="815" y1="160" x2="925" y2="160" stroke="#161616" stroke-width="2.2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
  <line x1="815" y1="343" x2="925" y2="343" stroke="#161616" stroke-width="2.2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
  <line x1="747.5" y1="220" x2="747.5" y2="285" stroke="#161616" stroke-width="2.2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
  <line x1="992.5" y1="220" x2="992.5" y2="285" stroke="#161616" stroke-width="2.2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>

  <!-- central annotation -->
  <text class="sans center-label" x="870" y="240" text-anchor="middle">Réseau de Cœurs</text>
  <text class="sans center-label" x="870" y="260" text-anchor="middle">(Calcul + Mémoire)</text>
</svg>
